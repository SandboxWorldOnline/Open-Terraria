# PR 泄密闸(2026-10-20):main 只许 PR 合入,本闸为 PR 必需检查。
# 全史扫描(fetch-depth 0 + 仓内 .gitleaks.toml 规则;豁免面带案件注释,勿盲扩)。
# 本地等价:gitleaks detect --source . --redact(全绿=历史持续可信,判例见 docs)。
name: gitleaks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.30.1
        run: |
          curl -sSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          chmod +x gitleaks && sudo mv gitleaks /usr/local/bin/
          gitleaks version
      - name: Scan full history
        run: gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --verbose
